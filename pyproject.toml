[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff.lint.per-file-ignores]
# Scripts set sys.path before imports (run from repo root)
"scripts/*.py" = ["E402"]
"notebooks/run_04_test.py" = ["E402"]
"lab/mnist/train_mlp.py" = ["E402"]
"lab/cnn/train_cnn.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
